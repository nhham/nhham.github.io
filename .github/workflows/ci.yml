name: CI

# Runs on every pull request and every push to main.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: checks-and-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Quality checks
        run: npm run check
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
